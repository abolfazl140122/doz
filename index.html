<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خوش آمدید</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap');

        :root {
            --primary-color: #f02e65;
            --success-color: #10b981;
            --error-color: #ef4444;
            --neutral-color: #6b7280;
            --light-bg: #f9fafb;
            --dark-text: #1f2937;
            --card-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            color: var(--dark-text);
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        .card {
            background-color: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: var(--card-shadow);
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 25px;
            color: var(--dark-text);
        }
        
        p {
            font-size: 1.1rem;
            line-height: 1.8;
            color: var(--neutral-color);
            margin-bottom: 30px;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: 700;
            font-family: 'Vazirmatn', sans-serif;
            border-radius: 50px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background-color: #d62255;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <h1>خوش آمدید!</h1>
            
            <p>
                این یک نسخه ساده و حرفه‌ای از بازی است.<br>
                بدون نیاز به ثبت نام یا ورود، می‌توانید از آن لذت ببرید.
            </p>
            
            <a href="#" class="btn" onclick="alert('به زودی بازی شروع می‌شود!'); return false;">شروع بازی</a>
        </div>
    </div>

</body>
</html>
